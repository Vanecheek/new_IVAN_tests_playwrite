name: ci-vanacheek-pipeline

on:
  schedule:
    # GitHub Actions cron працює в UTC.
    # 09:55 UTC = 12:55 за Києвом у літній період.
    - cron: "55 9 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright-tests
        continue-on-error: true
        run: npx playwright test --reporter=list,allure-playwright

      - name: Check Allure results
        if: always()
        run: |
          echo "Allure results:"
          ls -la ./allure-results || true

      - name: Generate Allure report
        if: always()
        run: npx allure generate ./allure-results --clean -o ./allure-report

      - name: Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report
          if-no-files-found: error
          retention-days: 14

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: Install Puppeteer
        if: always()
        run: npm install --no-save puppeteer

      - name: Wait for GitHub Pages and create screenshot
        if: always()
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer');

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const reportUrl = process.env.REPORT_URL;

            const browser = await puppeteer.launch({
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox'
              ]
            });

            try {
              const page = await browser.newPage();

              await page.setViewport({
                width: 1920,
                height: 1080,
                deviceScaleFactor: 1
              });

              let loaded = false;

              for (let attempt = 1; attempt <= 12; attempt++) {
                console.log(
                  `Opening Allure report, attempt ${attempt}: ${reportUrl}`
                );

                try {
                  const response = await page.goto(reportUrl, {
                    waitUntil: 'networkidle2',
                    timeout: 30000
                  });

                  if (response && response.ok()) {
                    await page.waitForSelector('body', {
                      timeout: 10000
                    });

                    loaded = true;
                    break;
                  }

                  console.log(
                    `Page returned status: ${response?.status()}`
                  );
                } catch (error) {
                  console.log(`Report is not ready yet: ${error.message}`);
                }

                await sleep(10000);
              }

              if (!loaded) {
                throw new Error(
                  `GitHub Pages report was not available: ${reportUrl}`
                );
              }

              await sleep(3000);

              await page.screenshot({
                path: 'allure-report-screenshot.png',
                fullPage: true
              });

              console.log('Allure screenshot created');
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Upload Allure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-screenshot
          path: allure-report-screenshot.png
          if-no-files-found: warn
          retention-days: 14

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TEST_OUTCOME: ${{ steps.playwright-tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then
            STATUS="✅ Тесты прошли, радуйся пока"
          else
            STATUS="❌ Тесты упали, еблан"
          fi

          MESSAGE="$STATUS

          📊 <a href=\"$REPORT_URL\">Відкрити Allure Report</a>"

          curl -s -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"

          if [ -f allure-report-screenshot.png ]; then
            curl --fail --silent --show-error \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "photo=@allure-report-screenshot.png"
          else
            echo "Screenshot was not created, sending message only"
          fi

      - name: Mark workflow as failed when tests failed
        if: always() && steps.playwright-tests.outcome == 'failure'
        run: |
          echo "Playwright tests failed"
          exit 1